services:
  database:
    image: mongo:8
    volumes: 
      - "mongo-data:/data/db"
    restart: always
    networks:
      - backend-database
    expose:
      - 27017

  backend:
    build: ./backend
    depends_on:
      - database
    environment:
      MONGODB_URL: mongodb://mongo:27017
      ADMIN_PASSWORD: tiny-swords-admin
      SESSION_SECRET: tiny-swords-secret
    ports:
      - "8080:8080"
    restart: always
    networks:
      - backend-database
      - frontend-backend
    expose: 
      - 3000

  frontend:
    build:
      context: frontend
      target: development
    ports:
      - 3000:3000
    stdin_open: true
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
    networks:
      - frontend-backend
    depends_on:
      - backend
      
networks:
  backend-database:
  frontend-backend:

volumes:
  mongo-data:
